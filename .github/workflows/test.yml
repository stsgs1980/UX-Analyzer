name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-integration:
    name: Unit & Integration
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/dev.db"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun test --isolate --path-ignore-patterns=tests/e2e/**

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./db/dev.db"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-bun-pw-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-pw-
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: mkdir -p db && bun run db:push --accept-data-loss 2>/dev/null || true
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      - run: |
          bun run start &
          for i in $(seq 1 12); do
            sleep 3
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Server ready after $((i * 3))s"
              break
            fi
          done
      - run: bunx playwright test --reporter=list
